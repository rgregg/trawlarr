name: CI
on:
  # `v*` tags are releases: they run the same checks, then publish a versioned
  # image. See the `image` job.
  push: { branches: [main], tags: ['v*'] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup@v4 errors out when the
      # version is given both here and as `packageManager` in package.json, so
      # package.json stays the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:refs
      - run: pnpm build
      # Package build tsconfigs exclude `*.test.ts`, so neither `pnpm build` nor
      # `pnpm test` type-checks a test file. Without this step a type error in a test
      # is green in CI, and several tests are structural guards written as type-level
      # literals — they only guard anything if this runs.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm audit:licenses
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm compat:fetch
      - run: pnpm test -- --coverage

  # Publishes ghcr.io/rgregg/trawlarr, and only after `check` is green — an
  # image is what gets deployed onto a real library, so a red build must never
  # become one. Pushes only: a pull request (possibly from a fork) gets no
  # package-write token and publishes nothing.
  #
  #   push to main  -> :main, :sha-<short>
  #   tag vX.Y.Z    -> :X.Y.Z, :X.Y, :X (from 1.0.0 on), :latest, :sha-<short>
  #   tag vX.Y.Z-rc.N -> :X.Y.Z-rc.N, :sha-<short> (never :X.Y, :X or :latest)
  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with the version the daemon reports would publish
      # :0.2.0 of a build that calls itself 0.1.0. `build-info.test.ts` already
      # holds DAEMON_VERSION equal to this file, so checking the tag against it
      # closes the loop.
      - name: Release tag matches the server package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/server/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/server/package.json version $pkg"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is set explicitly below rather than by the action's own
          # rules, so it can only ever mean "the newest release". A semver
          # pre-release always has a `-` (v0.2.0-rc.1) and a release never
          # does; without that check a release candidate took :latest from
          # every server tracking it. (The {{major}}.{{minor}} and {{major}}
          # patterns already skip pre-releases on their own.)
          #
          # :X is withheld while the major version is 0. Semver lets any 0.x
          # minor break compatibility, so :0 would promise a stable line that
          # does not exist — it would just be :latest under another name.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TRAWLARR_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
