name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup@v4 errors out when the
      # version is given both here and as `packageManager` in package.json, so
      # package.json stays the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm audit:licenses
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm compat:fetch
      - run: pnpm test -- --coverage
