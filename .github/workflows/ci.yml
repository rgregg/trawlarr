name: CI
on:
  # `v*` tags are releases: they run the same checks, then publish a versioned
  # image. See the `image` job.
  push: { branches: [main], tags: ['v*'] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup@v4 errors out when the
      # version is given both here and as `packageManager` in package.json, so
      # package.json stays the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:refs
      - run: pnpm build
      # Package build tsconfigs exclude `*.test.ts`, so neither `pnpm build` nor
      # `pnpm test` type-checks a test file. Without this step a type error in a test
      # is green in CI, and several tests are structural guards written as type-level
      # literals — they only guard anything if this runs.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm audit:licenses
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm compat:fetch
      - run: pnpm test -- --coverage

  # The container suite: one server and several nodes from the image built out
  # of this commit (docker/cluster/). Independent of `check` so neither waits
  # for the other, and `image` does not wait for this.
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trawlarr-cluster:dev
          # The suite refuses an image that was not built from the commit
          # checked out here (docker/cluster/docker.ts).
          build-args: |
            TRAWLARR_COMMIT=${{ github.sha }}
            TRAWLARR_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
      # Not `pnpm test:cluster`: that would build the image a second time.
      # Both flags are needed: vitest loads the root workspace file whatever
      # --config says, and that workspace excludes the cluster tests.
      - run: pnpm exec vitest run --config vitest.cluster.config.ts --workspace vitest.cluster.workspace.ts
        env:
          # A missing docker must fail this job, not skip the suite.
          TRAWLARR_REQUIRE_DOCKER: '1'

  # Publishes ghcr.io/rgregg/trawlarr, and only after `check` is green — an
  # image is what gets deployed onto a real library, so a red build must never
  # become one. Pushes only: a pull request (possibly from a fork) gets no
  # package-write token and publishes nothing.
  #
  #   push to main  -> :main, :sha-<short>
  #   tag vX.Y.Z    -> :X.Y.Z, :X.Y, :X (from 1.0.0 on), :latest, :sha-<short>
  #   tag vX.Y.Z-rc.N -> :X.Y.Z-rc.N, :sha-<short> (never :X.Y, :X or :latest)
  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        # Full history and tags: `git describe` needs them to name the version.
        with: { fetch-depth: 0 }
      # The tag is the version: the image reports what `git describe` says, so
      # a published :0.2.0 cannot call itself anything else.
      - id: version
        run: echo "version=$(node scripts/stamp-version.mjs --print)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is set explicitly below rather than by the action's own
          # rules, so it can only ever mean "the newest release". A semver
          # pre-release always has a `-` (v0.2.0-rc.1) and a release never
          # does; without that check a release candidate took :latest from
          # every server tracking it. (The {{major}}.{{minor}} and {{major}}
          # patterns already skip pre-releases on their own.)
          #
          # :X is withheld while the major version is 0. Semver lets any 0.x
          # minor break compatibility, so :0 would promise a stable line that
          # does not exist — it would just be :latest under another name.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TRAWLARR_COMMIT=${{ github.sha }}
            TRAWLARR_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
